services:
  - type: web
    name: aesthetic-explorer
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # NODE_ENV is set only for the running server (not for the build step):
    # setting it as a service-wide env var would make `npm ci` skip the
    # devDependencies (esbuild, vite, typescript...) the build needs.
    startCommand: NODE_ENV=production node dist/server.cjs
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Optional — only needed to make /api/report and /api/feedback survive
      # redeploys by syncing feedback_data/ to a private HF Dataset repo.
      # Leave blank (or remove) to skip: feedback still works, it just stays
      # on this service's ephemeral disk. See README's "Feedback & reporting"
      # section.
      - key: FEEDBACK_DATASET_REPO
        sync: false
      - key: HF_TOKEN
        sync: false
